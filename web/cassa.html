<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Cassa — SimoBS</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <div class="barra">
    <h1 id="titolo-festa">SimoBS</h1>
    <span class="serata" id="etichetta-serata"></span>
    <a class="navlink" href="cassa.html">Cassa</a>
    <a class="navlink" href="reparto.html">Reparto</a>
    <a class="navlink" href="monitor.html">Monitor reparto</a>
    <a class="navlink" href="chiamate.html">Ritiri</a>
    <a class="navlink" href="report.html">Report</a>
    <a class="navlink" href="gestione.html">Gestione</a>
    <div class="spinta">
      <select id="scelta-cassa" title="Postazione di cassa"></select>
      <input id="operatore" placeholder="Chi è in cassa" size="14" autocomplete="off">
      <button id="ristampa" class="bottone-piatto" disabled title="Ristampa l'ultimo scontrino su questa stampante">Ristampa</button>
      <button id="prova-stampante" class="bottone-piatto" title="Stampa di prova sulla stampante di questo PC">Prova stampa</button>
      <span class="stato-rete"><i class="pallino" id="pallino"></i><span id="etichetta-rete">collegato</span></span>
    </div>
  </div>

  <div id="avviso-serata" class="avviso grave" style="display:none; margin:12px 16px 0;"></div>
  <div id="avviso-postazione" class="avviso grave" style="display:none; margin:12px 16px 0;"></div>

  <div class="cassa">
    <div class="catalogo">
      <div class="categorie" id="categorie"></div>
      <div class="prodotti" id="prodotti"></div>
    </div>

    <div class="scontrino">
      <!--
        Prima cosa che si chiede al cliente, prima ancora dei prodotti: dove va
        a finire questa roba. Il tavolo finisce stampato grande sulla comanda,
        perché è l'unica indicazione che ha il cameriere per consegnare.
      -->
      <div class="destinazione">
        <div class="servizi" id="servizi"></div>
        <div class="griglia-campi" style="grid-template-columns:1fr 1fr;">
          <div class="campo">
            <label for="tavolo">Tavolo</label>
            <input id="tavolo" inputmode="numeric" autocomplete="off" placeholder="n.">
          </div>
          <div class="campo">
            <label for="coperti">Coperti</label>
            <input id="coperti" inputmode="numeric" value="0" autocomplete="off">
          </div>
        </div>
      </div>

      <div class="righe" id="righe"></div>
      <div class="totali">
        <!-- Sconto e nota affiancati: su un portatile da 1366x768 ogni riga in
             meno qui è una riga in più di carrello visibile, ed è il carrello
             che il cassiere deve poter leggere. -->
        <div class="griglia-campi" style="grid-template-columns:auto 1fr; gap:8px;">
          <div class="campo">
            <label for="sconto">Sconto €</label>
            <input id="sconto" inputmode="decimal" value="0" autocomplete="off" size="5">
          </div>
          <div class="campo">
            <label for="nota-ordine">Nota per i reparti</label>
            <input id="nota-ordine" placeholder="facoltativa" autocomplete="off">
          </div>
        </div>
        <div class="pagamenti" id="pagamenti"></div>
        <div class="totale-grande"><span>Totale</span><span id="totale">0,00</span></div>
        <div class="azioni">
          <button class="bottone-rosso" id="svuota">Svuota</button>
          <button class="bottone-verde incassa" id="incassa">INCASSA</button>
        </div>
      </div>
    </div>
  </div>

  <div id="brindisi">
    <div class="etichetta">Comanda numero</div>
    <div class="numero" id="brindisi-numero">0</div>
    <div class="totale" id="brindisi-totale"></div>
    <div class="nota">Tocca lo schermo per continuare</div>
  </div>

  <div id="messaggi"></div>
  <script src="compatibile.js"></script>
  <script type="module" src="cassa.js"></script>
</body>
</html>
